<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded dark background for strong contrast and bold silhouette, similar to Timesheet app -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#1A1A1A" />
  
  <!-- Perfume Cap -->
  <rect x="30" y="20" width="40" height="12" rx="4" fill="#D4AF37" />
  
  <!-- Perfume Neck -->
  <rect x="42" y="32" width="16" height="12" fill="#D4AF37" />
  
  <!-- Perfume Body -->
  <path d="M 25 44 L 75 44 L 80 80 C 80 85, 70 85, 50 85 C 30 85, 20 85, 20 80 Z" fill="#D4AF37" />
  
  <!-- Inner label detail (creates an "I" shape motif with the cap) -->
  <rect x="35" y="55" width="30" height="15" rx="3" fill="#1A1A1A" />
</svg>
