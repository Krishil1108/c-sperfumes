<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark noir background with rounded square -->
  <rect width="100" height="100" rx="18" fill="#0A0A0A"/>
  
  <!-- Gold perfume bottle body -->
  <path d="M 30 52 L 70 52 L 74 82 C 74 86, 65 88, 50 88 C 35 88, 26 86, 26 82 Z" fill="#C9A84C"/>
  
  <!-- Bottle neck -->
  <rect x="41" y="36" width="18" height="16" rx="2" fill="#C9A84C"/>
  
  <!-- Bottle cap -->
  <rect x="36" y="26" width="28" height="12" rx="5" fill="#E8C97E"/>
  
  <!-- Spray nozzle -->
  <rect x="57" y="20" width="12" height="8" rx="3" fill="#C9A84C"/>
  <rect x="65" y="16" width="4" height="8" rx="2" fill="#C9A84C"/>
  
  <!-- Bottle label (dark rectangle on gold) -->
  <rect x="34" y="60" width="32" height="16" rx="2" fill="rgba(10,10,10,0.35)"/>
  
  <!-- Label text lines -->
  <rect x="38" y="63" width="24" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>
  <rect x="40" y="68" width="20" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="42" y="73" width="16" height="1.5" rx="1" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Gold shine highlight on bottle -->
  <ellipse cx="39" cy="65" rx="4" ry="10" fill="rgba(255,255,255,0.12)" transform="rotate(-10, 39, 65)"/>
</svg>
